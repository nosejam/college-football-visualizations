<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Football Visualizations</title>
<style>
:root{--ink:#142c35;--muted:#68767b;--paper:#f6f5f0;--line:#d8ddd7;--green:#24755c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.app-header{flex:none;border-bottom:1px solid var(--line);background:var(--paper);padding:20px 30px 0}.heading{max-width:1740px;margin:0 auto 15px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}h1{font:400 clamp(25px,2.7vw,35px)/1.15 Georgia,serif;letter-spacing:-.8px;margin:0}.heading p{margin:0 0 3px;font-size:12px;color:var(--muted)}.tabs{display:flex;gap:6px;max-width:1740px;margin:auto}.tab{appearance:none;border:0;border-bottom:3px solid transparent;padding:12px 18px 11px;background:transparent;font:550 14px/1.3 system-ui,sans-serif;color:var(--muted);cursor:pointer}.tab:hover{color:var(--green);background:#eaf0e7}.tab[aria-selected=true]{color:var(--green);border-bottom-color:var(--green)}.tab:focus-visible{outline:3px solid #4b9c81;outline-offset:-4px}.app-main{position:relative;flex:1;min-height:0;width:100%}.tab-panel{position:absolute;inset:0;visibility:hidden;pointer-events:none}.tab-panel.active{visibility:visible;pointer-events:auto;z-index:1}.tab-panel iframe{display:block;border:0;width:100%;height:100%;background:var(--paper)}.loading{position:absolute;top:25px;left:25px;padding:9px 13px;background:#fffdf8;border:1px solid var(--line);border-radius:4px;color:var(--muted);z-index:2}.loading[hidden]{display:none}.no-js{padding:25px}@media(max-width:700px){.app-header{padding:17px 15px 0}.heading{display:block;margin-bottom:12px}.heading p{font-size:11px;margin-top:6px}.tab{padding:11px 12px;font-size:13px}.tabs{gap:0}.tab{padding-left:7px;padding-right:7px;font-size:12px}}@media(max-width:420px){h1{max-width:340px;font-size:27px}.heading p{margin-top:5px}}
</style>
<style>__THEME_CSS__</style><script>__THEME_JS__</script></head>
<body>
<header class="app-header"><div class="heading"><h1>College Football Visualizations</h1><div class="heading-tools"><p>Maps, victory cycles, and playoff scenarios.</p><button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Dark mode" aria-checked="false">Dark mode</button></div></div><nav class="tabs" role="tablist" aria-label="College football visualizations"><button id="tab-predictor" class="tab" role="tab" aria-controls="panel-predictor" aria-selected="true" tabindex="0" data-view="predictor">Playoff Predictor</button><button id="tab-imperialism" class="tab" role="tab" aria-controls="panel-imperialism" aria-selected="false" tabindex="-1" data-view="imperialism">Imperialism Map</button><button id="tab-circles" class="tab" role="tab" aria-controls="panel-circles" aria-selected="false" tabindex="-1" data-view="circles">Victory Cycles</button></nav></header>
<main class="app-main"><section id="panel-imperialism" class="tab-panel" role="tabpanel" aria-labelledby="tab-imperialism" aria-hidden="true" inert><div class="loading" role="status">Loading Imperialism Map…</div><iframe id="view-imperialism" title="Imperialism Map" referrerpolicy="no-referrer"></iframe></section><section id="panel-circles" class="tab-panel" role="tabpanel" aria-labelledby="tab-circles" aria-hidden="true" inert><div class="loading" role="status">Loading Victory Cycles…</div><iframe id="view-circles" title="Victory Cycles" referrerpolicy="no-referrer"></iframe></section><section id="panel-predictor" class="tab-panel active" role="tabpanel" aria-labelledby="tab-predictor" aria-hidden="false"><div class="loading" role="status">Loading Playoff Predictor…</div><iframe id="view-predictor" title="Playoff Predictor" referrerpolicy="no-referrer"></iframe></section></main>
<noscript><p class="no-js">Enable JavaScript to use these interactive visualizations.</p></noscript>
<script id="embedded-views" type="application/json">__VIEWS__</script>
<script>__APP_JS__</script>
</body></html>
